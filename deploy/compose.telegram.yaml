services:
  goldway:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 90s
    env_file: ../.env
    volumes:
      - goldway-data:/data
      - ../config.json:/run/config.json:ro
    healthcheck:
      test: ["CMD", "goldway", "--config", "/run/config.json", "--db", "/data/goldway.sqlite", "health"]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 3
volumes:
  goldway-data:
