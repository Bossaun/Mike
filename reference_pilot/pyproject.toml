[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldway-telegram-pilot"
version = "0.1.0"
description = "Safety-first GOLDWAY Telegram assistant tied to existing Google Sheet"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
